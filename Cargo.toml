[package]
name = "tirith-mcp"
version = "1.0.3"
edition = "2024"
# rmcp 3.4 needs 1.88; the tray crates behind the default `tray` feature
# need 1.90 (`cargo +1.89 check` fails with default features).
rust-version = "1.90"
description = "MCP coordination server that keeps parallel coding agents from stepping on each other"
license = "MIT"
repository = "https://github.com/eabz/tirith"
readme = "README.md"
keywords = ["mcp", "agents", "coordination", "claims"]
categories = ["development-tools", "command-line-utilities"]
# Keep the crates.io package to what `cargo install` needs; docs, memory,
# and dist config live in the repository.
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE"]
# The package is `tirith-mcp` on crates.io (the name `tirith` is taken by an
# unrelated crate); the binary and the library keep the short name.
[[bin]]
name = "tirith"
path = "src/main.rs"

[lib]
name = "tirith"
path = "src/lib.rs"

# The Jev micro-benchmark needs the Jev client (ADR-0024).
[[example]]
name = "jev_bench"
path = "examples/jev_bench/main.rs"
required-features = ["jev"]

[dependencies]
# MCP protocol: server over streamable HTTP, client with reqwest for the CLI.
rmcp = { version = "3.4.0", features = ["server", "client", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "transport-io"] }
# Async runtime for the daemon.
tokio = { version = "1.53.1", features = ["full"] }
# HTTP router hosting the MCP endpoint and the dashboard.
axum = "0.8.9"
# Serialization of state, tool inputs, and tool outputs.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# JSON Schema for MCP tool inputs, derived from the input types.
schemars = "1.2.2"
# Typed library errors.
thiserror = "2.0.20"
# Error context in the binary only.
anyhow = "1.0.104"
# CLI argument parsing.
clap = { version = "4.6.7", features = ["derive", "env"] }
# Timestamps and lease arithmetic.
chrono = { version = "0.4.45", features = ["serde"] }
# Identifiers.
uuid = { version = "1.26.1", features = ["v4", "serde"] }
# Structured logging.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# HTTP client the shim, the CLI client, and the tray use to reach the
# daemon; also rmcp's client transport. Tests use it for raw JSON-RPC.
reqwest = { version = "0.13.2", default-features = false }
# The Jev client (feature `jev`, ADR-0024) has its own HTTPS stack so
# reqwest stays localhost-only: hyper's pooled client (already in the tree
# through axum and reqwest) over rustls on the ring provider with Mozilla's
# roots, which cross-compiles to every release target.
hyper = { version = "1", default-features = false, optional = true }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"], optional = true }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "tls12", "webpki-tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }

[dev-dependencies]
# Isolated .tirith directories for store and integration tests.
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_must_use = "deny"
dead_code = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
strip = true
codegen-units = 1

# The macOS menu bar tray (`tirith tray`, ADR-0019). All optional and
# macOS-only; the `tray` feature turns them on and nothing else pulls them in.
[target.'cfg(target_os = "macos")'.dependencies]
# Status bar icon with a menu, over objc2; no window, no winit.
tray-icon = { version = "0.25", optional = true }
# The menu the tray shows (tray-icon's companion crate).
muda = { version = "0.20", optional = true }
# Safe AppKit bindings, already pulled by tray-icon: NSApplication's event pump.
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "NSApplication", "NSResponder", "NSEvent", "NSRunningApplication"] }
# Safe Foundation bindings, already pulled by tray-icon: NSDate and the run loop mode string.
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSDate", "NSString", "NSRunLoop", "NSObjCRuntime"] }

[features]
default = ["tray", "jev"]
# `tirith tray`: the macOS menu bar icon. Compiles to nothing off macOS.
tray = ["dep:tray-icon", "dep:muda", "dep:objc2-app-kit", "dep:objc2-foundation"]
# Experimental (ADR-0024): the Jev client behind `tirith serve --jev`. On by
# default; it only leaves localhost when a daemon is started with `--jev`.
# `--no-default-features --features tray` builds a localhost-only binary.
jev = ["dep:hyper", "dep:hyper-util", "dep:hyper-rustls", "dep:http-body-util", "dep:rustls"]
