# Publishes the crate to crates.io. Called by release.yml (generated by
# cargo-dist) as a custom publish job once every artifact was built and the
# GitHub release exists. Needs the repository secret CARGO_REGISTRY_TOKEN.
name: publish-crates
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish tirith-mcp
        run: cargo publish --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
