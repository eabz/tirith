[graph]
all-features = true

[advisories]
ignore = [
  # proc-macro-error is unmaintained. It reaches the lockfile only through
  # gtk, the Linux backend of tray-icon; Tirith depends on tray-icon on macOS
  # only (ADR-0019), so no shipped binary contains it. cargo-deny still walks
  # the Linux branch because the dependency is feature-activated. Drop this
  # when tray-icon moves off gtk3 or Tirith grows a Linux tray of its own.
  { id = "RUSTSEC-2024-0370", reason = "Linux-only transitive dependency of a macOS-only crate; never compiled" },
]

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "OpenSSL", "Unlicense", "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
