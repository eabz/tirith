[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "aarch64-pc-windows-msvc", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Custom publish jobs run after the GitHub release exists (see .github/workflows/publish-crates.yml)
publish-jobs = ["./publish-crates"]

# Build the Intel macOS binary on an Apple Silicon runner; the Apple toolchain
# cross-compiles both Mac targets and the arm runner is about twice as fast.
[dist.github-custom-runners]
x86_64-apple-darwin = "macos-14"
# ring (the jev feature's TLS crypto) calls plain clang for Windows ARM, which
# rejects the /imsvc flags cargo-xwin injects on the Linux runner dist picks
# by default. A Windows host builds it with MSVC and the image's LLVM instead.
aarch64-pc-windows-msvc = "windows-2022"
